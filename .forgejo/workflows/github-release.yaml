name: Sync release to GitHub

on:
  release:
    types:
      - published
      - edited

jobs:
  sync:
    runs-on: [debian-host]

    steps:
      - name: Resolve release metadata from event payload
        id: meta
        run: |
          set -euo pipefail
          ACTION=$(python3 -c "import json,os;print(json.load(open(os.environ['GITHUB_EVENT_PATH']))['action'])")
          TAG=$(python3 -c "import json,os;print(json.load(open(os.environ['GITHUB_EVENT_PATH']))['release']['tag_name'])")
          NAME=$(python3 -c "import json,os;r=json.load(open(os.environ['GITHUB_EVENT_PATH']))['release'];print(r.get('name') or r['tag_name'])")
          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"       >> "$GITHUB_OUTPUT"
          echo "name=${NAME}"     >> "$GITHUB_OUTPUT"
          echo "Action: ${ACTION}"; echo "Tag: ${TAG}"; echo "Name: ${NAME}"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Push tag to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: ll-SKY-ll/Matrix-federation-scanner
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)" || true
          set +x
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git push "${REMOTE_URL}" "refs/tags/${TAG}" 2>&1 | sed -e "s/${GH_TOKEN}/***/g" || {
            echo "Tag push failed (it may already exist on GitHub, which is fine)."
          }
          echo "Tag ${TAG} pushed (or already present) on GitHub."

      - name: Build .mbp (published only)
        if: steps.meta.outputs.action == 'published'
        env:
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          OUTPUT="${GITHUB_WORKSPACE}/cs_openreg-${VERSION}.mbp"
          cd bot
          zip -r "${OUTPUT}" \
            csreg_scanner \
            base-config.yaml \
            maubot.yaml \
            -x '*__pycache__*' \
            -x '*.pyc'
          echo "Built:"; ls -lh "${OUTPUT}"

      - name: Sync to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: ll-SKY-ll/Matrix-federation-scanner
          ACTION: ${{ steps.meta.outputs.action }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail

          export NOTES="${RUNNER_TEMP}/release-notes.md"
          python3 -c "import json,os;r=json.load(open(os.environ['GITHUB_EVENT_PATH']))['release'];open(os.environ['NOTES'],'w',encoding='utf-8').write(r.get('body') or '')"
          echo "----- release notes -----"; cat "${NOTES}"; echo; echo "-------------------------"

          MBP="cs_openreg-${TAG}.mbp"

          if gh release view "${TAG}" >/dev/null 2>&1; then EXISTS=1; else EXISTS=0; fi
          echo "GitHub release for ${TAG} exists: ${EXISTS}"

          if [ "${ACTION}" = "published" ]; then
            if [ "${EXISTS}" -eq 1 ]; then
              gh release edit "${TAG}" --title "${NAME}" --notes-file "${NOTES}" --latest
              gh release upload "${TAG}" "${MBP}" --clobber
            else
              gh release create "${TAG}" "${MBP}" --title "${NAME}" --notes-file "${NOTES}" --latest
            fi

          elif [ "${ACTION}" = "edited" ]; then
            if [ "${EXISTS}" -eq 1 ]; then
              echo "Edit: syncing notes/title only, asset untouched."
              gh release edit "${TAG}" --title "${NAME}" --notes-file "${NOTES}"
            else
              echo "Edit but no GitHub release yet -> upsert (build + create)."
              OUTPUT="${GITHUB_WORKSPACE}/${MBP}"
              ( cd bot && zip -r "${OUTPUT}" csreg_scanner base-config.yaml maubot.yaml -x '*__pycache__*' -x '*.pyc' )
              ls -lh "${OUTPUT}"
              gh release create "${TAG}" "${MBP}" --title "${NAME}" --notes-file "${NOTES}" --latest
            fi
          else
            echo "Unhandled action '${ACTION}' - nothing to do."
          fi

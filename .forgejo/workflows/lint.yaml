name: Lint

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  lint:
    runs-on: [debian-host]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up virtualenv and install deps
        working-directory: bot
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff
        working-directory: bot
        run: |
          . .venv/bin/activate
          ruff check .

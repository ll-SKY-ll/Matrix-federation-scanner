[pytest]
# auto mode: async test functions are collected and run without a per-test
# @pytest.mark.asyncio decorator. Keeps the DB tests uncluttered.
asyncio_mode = auto
testpaths = tests
norecursedirs = _old_reference
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    # aiosqlite warns that mautrix's $N placeholders look like named params and
    # will error on Python 3.14. This originates in db.py's SQL via the
    # mautrix->aiosqlite chain, NOT in the tests -- it is a real (separate)
    # source concern, silenced here only so it doesn't drown the CI log. Remove
    # this once db.py's sqlite path is addressed.
    ignore:Binding.*named parameter:DeprecationWarning
